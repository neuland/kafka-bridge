name: Manually build and publish container image

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build-and-publish-container-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - name: Test
        run: ./gradlew test
      - name: Log in to GitHub Packages container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and publish container image
        run: >-
          ./gradlew bootBuildImage
          -Pversion=$( git describe --tags )
          -PcontainerImageTag=$( git describe --tags )
          -PpublishImage=true
          -PregistryUsername=${{ github.actor }}
          -PregistryPassword=${{ secrets.GITHUB_TOKEN }}
