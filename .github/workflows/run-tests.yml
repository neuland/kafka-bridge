name: Run tests

on:
  pull_request:
    paths:
      - src/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - name: Test
        run: ./gradlew test
